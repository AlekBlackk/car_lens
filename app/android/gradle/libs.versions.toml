[versions]
# AGP и Kotlin сдвинуты вниз до версий, которые требует React Native Gradle Plugin
# 0.76.5 (задача 1, заметки спайка §2): наши пины были выше требуемых шаблоном RN
# 0.76.5, и по правилу §3 спеки («при расхождении двигается наша сторона») уступает
# именно наша сторона — единый плагин AGP/Kotlin используется во всём дереве
# (`:app`, `:vision`, `:demo`).
agp = "8.6.0"
kotlin = "1.9.24"
# План вехи пинует 2.1.6, но в Google Maven на этой версии опубликован только `litert`:
# `litert-gpu` и `litert-gpu-api` заканчиваются на 1.4.2 (GPU-делегат в линии 2.x вынесен
# из этих координат). Ближайшая версия, где публикуются все три — 1.4.2; ветку 1.x берём
# целиком, потому что смешивать ядро 2.x с делегатом 1.x нельзя.
litert = "1.4.2"
camerax = "1.4.1"
# Сдвинута вниз вместе с Kotlin 1.9.24 (см. выше): `kotlinx-serialization-json` 1.7.3
# требует Kotlin >= 2.0.0-RC1 (жёсткая проверка версии в рантайме библиотеки — падает
# на этапе компиляции `:vision`, а не только предупреждает). 1.6.3 — последний релиз
# ветки 1.6.x, совместимой с Kotlin 1.9.x.
kotlinxSerialization = "1.6.3"
junit = "4.13.2"
androidxActivity = "1.9.3"
androidxAnnotation = "1.9.1"
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"

[libraries]
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
litert-gpu-api = { module = "com.google.ai.edge.litert:litert-gpu-api", version.ref = "litert" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidxAnnotation" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
