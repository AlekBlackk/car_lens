org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Читает React Native Gradle Plugin для модуля `:app` (шаблон RN 0.76.5, задача 2
# M-1.6). Архитектура сборки задаётся здесь одним местом на всё дерево, а не через
# `-P` в командной строке, чтобы CI и локальные сборки не расходились.
newArchEnabled=true
hermesEnabled=true
# Только 64-битный ARM (решение владельца 2026-09-30): 32-битные телефоны и x86 не
# поддерживаются, а их нативные библиотеки занимали ~55 МБ release-APK при бюджете §5.2
# 45 МБ. `:app` берёт отсюда же фильтр упаковки `ndk.abiFilters`.
reactNativeArchitectures=arm64-v8a

# Обход опечатки в react-native-mmkv 3.3.3. Его `android/build.gradle:36` читает
# `rootProject.ext.ndkVersion`, а при его отсутствии — свойство `Mmkv_ndkVersion`; в
# собственном `gradle.properties` библиотеки ключ записан как `Mmkv_ndkversion`, со
# строчной «v». Совпадения нет ни там, ни там, `setNdkVersion(null)` бросает, и вместе с
# ним не доходит до вычисления `compileSdkVersion` — отсюда второе, вводящее в заблуждение
# сообщение «compileSdkVersion is not specified».
#
# Значение — то, которое библиотека и просила у себя. Свойство именное, а не
# `rootProject.ext.ndkVersion`: общий ext прочитали бы и `react-native-vision-camera`, и
# `react-native-worklets-core`, у которых сейчас работает выбор NDK по умолчанию AGP, и
# менять им тулчейн ради чужой опечатки нечем оправдать.
Mmkv_ndkVersion=26.1.10909125
