name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Установить Python
        run: uv python install 3.11

      - name: Синхронизировать зависимости
        run: uv sync --locked --group dev

      - name: Линт
        run: uv run ruff check .

      - name: Форматирование
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy

      - name: Тесты
        run: uv run pytest

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.11

      - run: uv sync --locked --group dev

      - name: Инварианты схемы и теста на утечку
        run: uv run pytest tests/test_split.py tests/test_schema.py tests/test_hashing.py tests/test_ingest_build.py -v
