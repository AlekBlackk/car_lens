name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Установить Python
        run: uv python install 3.11

      - name: Синхронизировать зависимости
        run: uv sync --locked --group dev

      - name: Линт
        run: uv run ruff check .

      - name: Форматирование
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy

      - name: Тесты
        run: uv run pytest -m "not export"

  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.11

      - run: uv sync --locked --group dev

      - name: Инварианты схемы и теста на утечку
        run: uv run pytest tests/test_split.py tests/test_schema.py tests/test_hashing.py tests/test_ingest_build.py -v

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Установить зависимости
        run: npm ci
        working-directory: app

      - name: Собрать TypeScript
        run: npm run build
        working-directory: app

      - name: Тесты читалки индекса
        run: npm test
        working-directory: app

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка и JVM-тесты модуля vision
        working-directory: app/android
        run: ./gradlew :vision:assembleDebug :vision:testDebugUnitTest
