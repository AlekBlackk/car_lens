name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Установить Python
        run: uv python install 3.11

      - name: Синхронизировать зависимости
        run: uv sync --group dev

      - name: Линт
        run: uv run ruff check .

      - name: Форматирование
        run: uv run ruff format --check .

      - name: Типы
        run: uv run mypy

      - name: Тесты
        run: uv run pytest
