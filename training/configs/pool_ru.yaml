# Конфиг прогона дообучения по русскому пулу (§6 дизайна). Копия рецепта M-1.2
# (`skeleton_stanford.yaml`) с одним отличием: `batch_size` 128 -> 32. Рецепт уже прошёл
# прогон и ревью, поэтому всякое другое отличие пришлось бы защищать отдельно.
#
# Причина отличия — бюджет шагов, на который откалиброваны EMA и косинус. 2863 кадра
# пула при батче 128 дают 22 шага на эпоху и 1320 шагов за 60 эпох против 5580 у M-1.2,
# а `ema_decay: 0.9998` откалиброван на ~5600 шагов: на 1320 шагах усреднение не
# догоняет веса (0.9998^1320 ~= 0.77), и замер пошёл бы по недосходившейся копии. Батч
# 32 даёт 89 шагов на эпоху (обучающий загрузчик идёт с `drop_last`,
# `training/dataset.py:165`) и 5340 шагов при тех же 60 эпохах.
#
# Конфаунд, названный заранее: при неизменённом `lr 3.0e-4` батч 32 — это вчетверо
# больше обновлений и вчетверо более шумный градиент на шаг. После прогона «данных мало»
# и «шагов вчетверо больше при том же lr» уже не развести, и это цена отличия, а не
# тонкость.
backbone: mobilenetv4_conv_medium.e500_r256_in1k
embedding_dim: 256
img_size: 320
batch_size: 32
epochs: 60
optimizer: AdamW
lr: 3.0e-4
weight_decay: 0.05
scheduler: cosine
warmup_epochs: 3
arcface:
  s: 32.0
  margin_start: 0.2
  margin_end: 0.5
  margin_warmup_epochs: 10
amp: bf16
ema_decay: 0.9998
grad_clip: 1.0
backbone_lr_mult: 0.1
backbone_lr_mult_epochs: 5
num_workers: 8
seed: 1337
