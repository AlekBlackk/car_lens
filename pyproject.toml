[project]
name = "carlens"
version = "0.1.0"
description = "Распознавание марки и модели автомобиля с камеры телефона"
requires-python = "==3.11.*"
# §13.4: всё, что участвует в обучении, детекции и экспорте, пинуется точным
# `==` и не двигается до конца M5. Диапазон здесь означал бы, что `uv lock` на
# другой машине или через полгода соберёт иные пиксели: pillow и opencv решают,
# как декодируется JPEG, albumentations и numpy — что выйдет из аугментаций,
# ultralytics — какие bbox нарежет детектор. Версии взяты из `uv.lock` на
# 2026-08-16, то есть из того окружения, в котором собраны сплиты M-1b.
dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.5",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "imagehash==4.3.2",
    "tqdm==4.70.0",
]

[dependency-groups]
train = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "timm==1.0.28",
    "albumentations==2.0.8",
    "scikit-learn==1.9.0",
    "ultralytics==8.4.120",
    "datasets==5.0.1",
]
export = [
    "litert-torch==0.9.3",
    "onnx==1.21.0",
    "onnxruntime==1.28.0",
]
# Инструменты разработки под правило §13.4 не подпадают намеренно: они не
# попадают ни в веса, ни в артефакты экспорта. Точный пин `ruff` вдобавок
# означал бы переформатирование всего дерева при каждом обновлении линтера.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pandas-stubs",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.16 форматирует и блоки кода внутри Markdown, а в docs/ лежат спека и
# планы: код там иллюстративный, переформатировать документацию нельзя. Сам
# каталог ведётся локально, вне git, поэтому в дереве репозитория его нет —
# строка страхует ruff на машинах, где docs/ существует, и удалять её нельзя.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Префикс `E` включает и `E501` (длина строки), то есть ограничение в 100 символов
# из `line-length` выше линтером проверяется, а не держится на честном слове. Считать
# длину вручную через `awk length` нельзя: в локали C он мерит байты, а кириллица в
# UTF-8 занимает по два — русский код так «нарушает» лимит на ровном месте.
# `E501` по устройству не ругается на строки, которые вылезли за лимит из-за прагмы
# (`# type: ignore`, `# noqa`) в конце — так же ведёт себя и `ruff format`.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Проект целиком на русском, правила дают ложные срабатывания на кириллице:
# одиночные слова «у», «а» и подобные ruff принимает за латиницу.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline", "scripts", "tests", "training"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "imagehash.*",
    "rapidfuzz.*",
    "pyarrow.*",
]
ignore_missing_imports = true

# Пакеты из группы `train`: в CI их нет, на машине разработчика есть. Без
# `follow_imports = skip` проверка типов зависела бы от того, установлена ли
# группа: в CI модуль становится `Any` и всё зелено, локально mypy читает
# настоящие аннотации и падает. Пропуск делает результат одинаковым в обоих
# окружениях. Обёртки над этими пакетами тонкие и покрыты тестами на подставных
# объектах, поэтому потеря типов здесь ничего не стоит.
[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "datasets.*",
    "torch.*",
    "timm.*",
    "albumentations.*",
    "sklearn.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
