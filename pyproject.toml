[project]
name = "carlens"
version = "0.1.0"
description = "Распознавание марки и модели автомобиля с камеры телефона"
requires-python = "==3.11.*"
# §13.4: всё, что участвует в обучении, детекции и экспорте, пинуется точным
# `==` и не двигается до конца M5. Диапазон здесь означал бы, что `uv lock` на
# другой машине или через полгода соберёт иные пиксели: pillow и opencv решают,
# как декодируется JPEG, albumentations и numpy — что выйдет из аугментаций,
# ultralytics — какие bbox нарежет детектор. Версии взяты из `uv.lock` на
# 2026-08-16, то есть из того окружения, в котором собраны сплиты M-1b.
dependencies = [
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "rapidfuzz==3.14.5",
    "pillow==12.3.0",
    "opencv-python-headless==5.0.0.93",
    "imagehash==4.3.2",
    "tqdm==4.70.0",
]

[dependency-groups]
train = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "timm==1.0.28",
    "albumentations==2.0.8",
    "scikit-learn==1.9.0",
    "ultralytics==8.4.120",
    "datasets==5.0.1",
]
# Экспорт идёт в отдельной venv, а не в обучающей: `litert-torch` тянет свой стек
# конвертера (jax, xdsl, torchao), и держать его рядом с обучением значило бы решать
# конфликты версий каждый раз, когда двигается любая из двух половин.
# `torch` продублирован из группы `train` тем же пином не для установки — его и так
# притянет `litert-torch` — а чтобы окружение экспорта не разошлось с обучающим по API
# графового захвата: между минорами torch он ломается. В 2.12 уже нет
# `torch.export.export_for_training`, а PT2E-квантизация уехала из
# `torch.ao.quantization.quantize_pt2e` в `torchao`. Пин держит эти имена на месте.
# `ai-edge-litert` — рантайм LiteRT, который приходит вместе с `litert-torch`; пин
# прямой, потому что интерпретатор импортируется в коде экспорта напрямую, а
# транзитивная зависимость контрактом не является и может уехать со следующим
# релизом конвертера.
# `torchao` — по тому же критерию: код экспорта импортирует
# `torchao.quantization.pt2e` напрямую (это единственное место, где в torch 2.12 живут
# `prepare_pt2e` и `convert_pt2e`). Без прямого пина `uv lock` через месяц подтянет
# другую версию PT2E-API вслед за `litert-torch`, и экспорт сломается молча.
# `scikit-learn` здесь не про экспорт: в M-1.4 индекс эталонов пересобирается на
# выходах квантованной модели, а k-means для центроидов берётся из sklearn. Запускается
# это в venv экспорта, где иначе `KMeans` не найдётся — причём не на импорте, а через
# сорок минут после старта, на самой сборке центроидов. `timm` нужен там же и раньше:
# без него не собрать архитектуру, в которую грузится чекпоинт.
# `albumentations` — по тому же критерию и с тем же пином, что в группе `train`: и
# калибровка квантизации, и замер паритета читают кропы через `build_transforms`
# (`training/dataset.py`), а этот модуль импортирует albumentations сверху. Без пина
# `export/to_tflite.py` в venv экспорта не импортируется вовсе. Версия обязана совпадать
# с обучающей: разошлись бы пиксели, по которым посчитаны шкалы квантования, и §4.4
# мерил бы препроцессинг вместо квантизации.
export = [
    "torch==2.12.0",
    "timm==1.0.28",
    "albumentations==2.0.8",
    "scikit-learn==1.9.0",
    "litert-torch==0.9.3",
    "ai-edge-litert==2.1.6",
    "torchao==0.18.0",
    "onnx==1.21.0",
    "onnxruntime==1.28.0",
]
# Инструменты разработки под правило §13.4 не подпадают намеренно: они не
# попадают ни в веса, ни в артефакты экспорта. Точный пин `ruff` вдобавок
# означал бы переформатирование всего дерева при каждом обновлении линтера.
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pandas-stubs",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.16 форматирует и блоки кода внутри Markdown, а в docs/ лежат спека и
# планы: код там иллюстративный, переформатировать документацию нельзя. Сам
# каталог ведётся локально, вне git, поэтому в дереве репозитория его нет —
# строка страхует ruff на машинах, где docs/ существует, и удалять её нельзя.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Префикс `E` включает и `E501` (длина строки), то есть ограничение в 100 символов
# из `line-length` выше линтером проверяется, а не держится на честном слове. Считать
# длину вручную через `awk length` нельзя: в локали C он мерит байты, а кириллица в
# UTF-8 занимает по два — русский код так «нарушает» лимит на ровном месте.
# `E501` по устройству не ругается на строки, которые вылезли за лимит из-за прагмы
# (`# type: ignore`, `# noqa`) в конце — так же ведёт себя и `ruff format`.
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Проект целиком на русском, правила дают ложные срабатывания на кириллице:
# одиночные слова «у», «а» и подобные ruff принимает за латиницу.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["export", "pipeline", "scripts", "tests", "training"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "imagehash.*",
    "rapidfuzz.*",
    "pyarrow.*",
]
ignore_missing_imports = true

# Пакеты из группы `train`: в CI их нет, на машине разработчика есть. Без
# `follow_imports = skip` проверка типов зависела бы от того, установлена ли
# группа: в CI модуль становится `Any` и всё зелено, локально mypy читает
# настоящие аннотации и падает. Пропуск делает результат одинаковым в обоих
# окружениях. Обёртки над этими пакетами тонкие и покрыты тестами на подставных
# объектах, поэтому потеря типов здесь ничего не стоит.
[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "datasets.*",
    "torch.*",
    "timm.*",
    "albumentations.*",
    "sklearn.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# Пакеты группы `export`: причина та же, что у `train` выше, только окружений уже три —
# CI, venv обучения и venv экспорта, и `litert-torch` установлен ровно в последнем. Без
# пропуска mypy давал бы три разных ответа на один и тот же код.
# Имена модулей проверены в собранной venv, а не выведены из имён пакетов: дистрибутив
# `litert-torch` ставит модуль `litert_torch`, `ai-edge-litert` — `ai_edge_litert`;
# `torchao` попадает сюда потому, что в torch 2.12 PT2E-квантизация живёт там
# (`torch.ao.quantization.quantize_pt2e` из старых примеров больше не существует).
[[tool.mypy.overrides]]
module = [
    "litert_torch.*",
    "ai_edge_litert.*",
    "ai_edge_quantizer.*",
    "torchao.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Маркер, а не skipif по импорту: тесты экспорта запускаются только в venv экспорта, а
# джоб `python` в CI ставит одну группу `dev` и торча там нет вовсе. Регистрация нужна,
# чтобы `-m "not export"` знал это имя и чтобы pytest не сыпал `PytestUnknownMarkWarning`
# на каждый помеченный тест.
markers = ["export: требует venv экспорта с litert-torch и ai-edge-litert"]
