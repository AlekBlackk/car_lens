[project]
name = "carlens"
version = "0.1.0"
description = "Распознавание марки и модели автомобиля с камеры телефона"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.9",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "imagehash>=4.3.1",
    "tqdm>=4.66",
]

[dependency-groups]
train = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "timm==1.0.28",
    "albumentations>=2.0,<3",
    "scikit-learn>=1.5",
    "ultralytics>=8.3,<9",
    "datasets>=3.0",
]
export = [
    "litert-torch==0.9.3",
    "onnx>=1.17",
    "onnxruntime>=1.19",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pandas-stubs",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff 0.16 форматирует и блоки кода внутри Markdown, а в docs/ лежат спека и
# планы: код там иллюстративный, переформатировать документацию нельзя. Сам
# каталог ведётся локально, вне git, поэтому в дереве репозитория его нет —
# строка страхует ruff на машинах, где docs/ существует, и удалять её нельзя.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# Проект целиком на русском, правила дают ложные срабатывания на кириллице:
# одиночные слова «у», «а» и подобные ruff принимает за латиницу.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline", "scripts", "tests"]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "imagehash.*",
    "ultralytics.*",
    "datasets.*",
    "rapidfuzz.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
