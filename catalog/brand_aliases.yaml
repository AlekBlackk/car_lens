# Карта «сырое написание марки → каноническая марка каталога» (§6).
#
# Применяется ДО `normalize()`. Внутри неё чинить нечего: `normalize` фильтрует
# каталог по слагу марки, а `aliases.yaml` ищет уже среди отобранных моделей —
# кириллическое написание марки до карты моделей не доживает, потому что
# `brand_slug()` оставляет только `[a-z0-9]` и на кириллице отдаёт пустую строку.
#
# Значения — латиница, как в `canonical.yaml`: из марки собирается слаг
# `model_id`, а тот обязан быть ASCII (`catalog.py`). Русское написание живёт в
# `display` каталога и здесь, в ключах.
#
# Карта ведётся руками, и иначе не выйдет: транслитерации в правилах §3.3 нет,
# «Хёндэ» → `hyundai` алгоритмически не выводится, а fuzzy на кириллице
# сравнивает пустые строки — `_ключ_сравнения` тоже оставляет только `[a-z0-9]`.
#
# Ключ проходит при загрузке ту же подготовку, что и сырая строка объявления:
# нижний регистр, снятие диакритики, схлопывание пробелов. Поэтому «ё» и «й» в
# ключе необязательны — «Хёндэ» и «Хендэ» дают одну и ту же запись — но по той
# же причине двух записей, различающихся только «ё» или «й», быть не может:
# загрузчик на такой паре падает. Линтер дублей YAML её не поймает, для YAML
# это два разных ключа, а схлопывает их подготовка.
#
# Латинские марки каталога здесь не дублируются: промах при непустом слаге
# отдаёт сырое имя, и `Volkswagen` доходит до каталога сам. Записи с латинским
# ключом нужны там, где написание с каноническим именем не совпадает (`vaz`,
# `mercedes`, `vw`) или где важен регистр («LADA» → «Lada»).
version: 1
brands:
  # Российские марки: латиницей их в объявлениях почти не пишут.
  лада: Lada
  ваз: Lada
  lada: Lada
  vaz: Lada
  уаз: UAZ
  газ: GAZ
  москвич: Moskvich
  moskvitch: Moskvich
  азлк: Moskvich

  # Массовые иностранные марки российского парка в русском написании.
  хендай: Hyundai
  хёндэ: Hyundai
  хундай: Hyundai
