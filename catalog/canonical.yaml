# Платформенные группы (§13.2, §5.1 дизайна): несколько model_id, различающихся только
# шильдиком, — один класс обучения и один слот в catalog_index.bin. Кузов, оптика и
# решётка совпадают, различие — эмблема и надпись; различить такие машины по кропу
# физически нельзя, и требовать этого от сети бессмысленно.
#
# Здесь ровно пять групп — те, что §5.1 подтверждает. Кандидаты §5.2 (Duster/Terrano,
# Chevrolet Niva / Niva Travel, Largus / Logan MCV, on-DO / Granta) остаются отдельными
# классами: решает их confusion-замер на M3, а не впечатление от фотографий.
groups:
  grp__jac_js4:
    members: [moskvich__3, jac__js4]
    display: "Москвич 3 / JAC JS4"
  grp__coolray:
    members: [geely__coolray, belgee__x50]
    display: "Geely Coolray / Belgee X50"
  grp__atlas_pro:
    members: [geely__atlas_pro, belgee__x70]
    display: "Geely Atlas Pro / Belgee X70"
  grp__solaris_hs:
    members: [hyundai__solaris, solaris__hs]
    display: "Hyundai Solaris / Solaris HS"
  grp__tiggo7:
    members: [chery__tiggo_7_pro, xcite__x_cross_7]
    display: "Chery Tiggo 7 Pro / Xcite X-Cross 7"
