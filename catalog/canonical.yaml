# Канонический каталог марок и моделей российского парка.
#
# model_id собирается как <слаг марки>__<слаг модели>, отдельным полем не хранится.
# Единица приёмки — КЛАСС, а не модель (§13.2): пять платформенных групп внизу файла
# дают пять классов на десять моделей. Итог — 192 класса на 197 моделях, 49 марок.
#
# 150 классов — каталог 0.5; ещё 42 добавлены в 0.6 из MAD-Cars (модели с ≥ 100 машин вне
# каталога, `bench/catalog-192-preregistration.md`). Преемники с новым именем живут классом
# предшественника: K5 — в Optima, ix35 — в Tucson, M-Class — в GLE, GLK — в GLC, GLS — в GL.
#
# Состав набран по долям парка АВТОСТАТ (§3 дизайна `2026-08-25-m0-catalog-ru-design.md`),
# разложен по квотам §4 и проверяется `tests/test_canonical_catalog.py`. Правка состава
# без правки того теста — это молчаливый уход от 150 классов и от порога §10 в 40 марок.
#
# display отечественных марок — кириллицей: так их пишут в объявлениях. Иномарки —
# латиницей: на улице их узнают по надписи на крышке багажника (§6 дизайна, рулинг 3).
# Идентификаторы латиницей везде: model_id уходит в имена файлов и в JSON на устройстве.
#
# Поколения и рестайлинги отдельными классами не заводятся (§7): Kia Rio трёх поколений —
# один класс. Праворульные версии — тоже (Corolla Fielder живёт классом Corolla).
