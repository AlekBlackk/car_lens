# Карта «сырая строка → model_id» для случаев, где fuzzy не справляется.
# Ключ проходит при загрузке подготовку §3.3 — нижний регистр, снятие
# диакритики, схлопывание пробелов, — то есть ту же, что и строка объявления, и
# писать его можно как пишется: «семёрка» находится по «Семёрка» и «семерка».
# Остальные правила §3.3 к ключу не применяются: отсечка объёма и трим-уровней
# идёт только по объявлению.
# По той же причине двух ключей, различающихся лишь диакритикой («семёрка» и
# «семерка»), быть не может — загрузчик на такой паре падает.
#
# Значение — всегда существующий `model_id` каталога, и это проверяется тестом
# `tests/test_canonical_catalog.py`: алиас в несуществующую модель не ошибка, а
# тишина — `normalize` сочтёт его чужой маркой и уйдёт в fuzzy как ни в чём не бывало.
#
# Алиас принимается только внутри заявленной марки, поэтому одинаковые разговорные
# имена у разных марок не конфликтуют: «нива» у Lada ведёт в Ниву Легенду, а у
# Chevrolet тот же ключ игнорируется и строку разбирает fuzzy.
#
# Наполняется по мере разбора unmapped.csv на M1 (§3.3).
version: 1
aliases:
  # Разговорные имена вазовской классики: в объявлениях их пишут вместо номера,
  # а fuzzy сравнивает с ключом модели («2107») и на «семёрке» даёт ноль.
  копейка: lada__2101
  жигули: lada__2107
  семёрка: lada__2107
  шестёрка: lada__2106
  четвёрка: lada__2104

  # Самара и Самара-2: номер кузова в речи почти не звучит.
  восьмёрка: lada__samara
  девятка: lada__samara
  тринашка: lada__samara_2
  четырка: lada__samara_2
  четырнашка: lada__samara_2
  пятнашка: lada__samara_2

  # Десятое семейство и переднеприводные после него.
  десятка: lada__2110
  двенашка: lada__2110
  приора: lada__priora
  калина: lada__kalina
  гранта: lada__granta
  веста: lada__vesta
  икс рей: lada__xray
  ларгус: lada__largus
  нива: lada__niva_2121
  нива тревел: lada__niva_travel
  шнива: chevrolet__niva

  # УАЗ, ГАЗ и Москвич: у всех трёх разговорное имя вытеснило заводское.
  буханка: uaz__bukhanka
  патриот: uaz__patriot
  хантер: uaz__hunter
  газель: gaz__gazel
  волга: gaz__volga_3110
  соболь: gaz__sobol
  святогор: moskvich__2141

  # Немецкие обозначения кузовов: в объявлениях встречаются наравне с английскими.
  c-klasse: mercedes_benz__c_class
  e-klasse: mercedes_benz__e_class
  3er: bmw__3_series
  5er: bmw__5_series
